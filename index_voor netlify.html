<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lappendag</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        height: 100dvh;
        background: #07070a;
      }
      #site-frame {
        display: block;
        width: 100%;
        height: 100%;
        height: 100dvh;
        border: 0;
      }
      #site-loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #07070a;
        color: #f3f4f6;
        font-family: system-ui, sans-serif;
        font-size: 1rem;
        letter-spacing: 0.02em;
      }
      #site-loading[hidden] {
        display: none;
      }
      #site-error {
        font-family: system-ui, sans-serif;
        padding: 2rem;
        color: #f3f4f6;
      }
    </style>
  </head>
  <body>
    <div id="site-loading">Site laden…</div>
    <iframe id="site-frame" title="Lappendag"></iframe>
    <script>
      (async function loadLappendag() {
        const repo = "daanbrouwer0-collab/Lappendag";
        const SHA_KEY = "lappendag-cdn-sha";
        const loading = document.getElementById("site-loading");
        const frame = document.getElementById("site-frame");

        let version = "main";
        try {
          const cached = localStorage.getItem(SHA_KEY);
          if (cached) version = cached;
        } catch (_) {
          // localStorage unavailable
        }

        // jsDelivr caches @main for up to a week — prefer commit SHA URLs.
        let base = `https://cdn.jsdelivr.net/gh/${repo}@${version}`;
        let overlayHidden = false;
        let shaReloadDone = false;
        let currentPath = "index.html";

        function hideOverlay() {
          if (overlayHidden) return;
          overlayHidden = true;
          if (loading) loading.hidden = true;
        }

        function setVersion(next) {
          version = next;
          base = `https://cdn.jsdelivr.net/gh/${repo}@${version}`;
          try {
            localStorage.setItem(SHA_KEY, next);
          } catch (_) {
            // ignore quota / private mode
          }
        }

        function refreshShaAndMaybeReload() {
          fetch(`https://api.github.com/repos/${repo}/commits/main?per_page=1`)
            .then((res) => (res.ok ? res.json() : null))
            .then((data) => {
              if (!data || !data.sha) return;
              if (data.sha === version) {
                try {
                  localStorage.setItem(SHA_KEY, data.sha);
                } catch (_) {}
                return;
              }
              // Pinned SHA avoids stale @main CDN cache; reload once with fresh commit.
              if (shaReloadDone) {
                try {
                  localStorage.setItem(SHA_KEY, data.sha);
                } catch (_) {}
                return;
              }
              shaReloadDone = true;
              if (loading) {
                loading.hidden = false;
                overlayHidden = false;
              }
              setVersion(data.sha);
              show(currentPath).catch(() => {
                hideOverlay();
                document.body.innerHTML =
                  '<p id="site-error">Kon de Lappendag-site niet laden vanaf GitHub.</p>';
              });
            })
            .catch(() => {
              // keep cached / main
            });
        }

        function normalizePath(path) {
          let p = (path || "index.html").replace(/^\/+/, "");
          if (!p || p.endsWith("/")) p += "index.html";
          return p;
        }

        function rewriteAssetUrls(html, pagePath) {
          const pageDir = pagePath.includes("/")
            ? pagePath.slice(0, pagePath.lastIndexOf("/") + 1)
            : "";
          const pageBase = `${base}/${pageDir}`;

          if (!/<base\s/i.test(html)) {
            html = html.replace(
              /<head([^>]*)>/i,
              `<head$1><base href="${pageBase}">`
            );
          }
          return html;
        }

        function wireNavigation(doc) {
          doc.addEventListener("click", (event) => {
            const anchor = event.target.closest("a");
            if (!anchor) return;

            const href = anchor.getAttribute("href");
            if (!href || href.startsWith("#")) return;
            if (/^(mailto:|tel:|javascript:)/i.test(href)) return;

            const absolute = /^(https?:)?\/\//i.test(href);
            if (absolute) {
              return;
            }

            event.preventDefault();
            const current = normalizePath(
              (location.hash || "#index.html").slice(1)
            );
            const currentDir = current.includes("/")
              ? current.slice(0, current.lastIndexOf("/") + 1)
              : "";
            const resolved = new URL(href, `https://local.invalid/${currentDir}`);
            const nextPath = normalizePath(resolved.pathname.replace(/^\//, ""));
            history.pushState({ path: nextPath }, "", `#${nextPath}`);
            show(nextPath);
          });
        }

        async function show(path) {
          currentPath = normalizePath(path);
          const pagePath = currentPath;
          const res = await fetch(`${base}/${pagePath}`);
          if (!res.ok) {
            throw new Error(`Pagina niet gevonden: ${pagePath}`);
          }

          const html = rewriteAssetUrls(await res.text(), pagePath);
          frame.onload = () => {
            hideOverlay();
            try {
              const doc = frame.contentDocument;
              if (!doc) return;
              wireNavigation(doc);
              const title = doc.querySelector("title");
              if (title && title.textContent) {
                document.title = title.textContent;
              }
            } catch (_) {
              // negeer als iframe niet bereikbaar is
            }
          };
          frame.srcdoc = html;
        }

        refreshShaAndMaybeReload();

        const initial = normalizePath(
          (location.hash || "#index.html").slice(1)
        );
        history.replaceState({ path: initial }, "", `#${initial}`);
        await show(initial);

        window.addEventListener("popstate", (event) => {
          const path =
            (event.state && event.state.path) ||
            normalizePath((location.hash || "#index.html").slice(1));
          show(path).catch(() => {
            hideOverlay();
            document.body.innerHTML =
              '<p id="site-error">Kon de Lappendag-site niet laden vanaf GitHub.</p>';
          });
        });
      })().catch(() => {
        const loading = document.getElementById("site-loading");
        if (loading) loading.hidden = true;
        document.body.innerHTML =
          '<p id="site-error">Kon de Lappendag-site niet laden vanaf GitHub.</p>';
      });
    </script>
  </body>
</html>

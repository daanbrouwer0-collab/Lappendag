<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAPPENDAG AFTERPARTY // RAVE EDITION</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Ambient background glow effects -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>
  <div class="grid-overlay"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="badge"><i class="fa-solid fa-bolt"></i> RAVE ARCHIVE 2026</div>
      <h1 class="title">LAPPENDAG <span class="neon-text">AFTERPARTY</span></h1>
      <p class="subtitle">Exclusieve DJ Sets & Audio Streams • Non-Stop Energy</p>
    </header>

    <!-- Main Content Grid -->
    <main class="main-layout">
      <!-- Player Section -->
      <section class="player-card glass-panel">
        <div class="visualizer-wrapper">
          <div class="disc-container">
            <div class="disc" id="disc">
              <div class="disc-inner">
                <i class="fa-solid fa-compact-disc disc-icon"></i>
              </div>
            </div>
          </div>
          <!-- Equalizer animation -->
          <div class="eq-bars" id="eqBars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
        </div>

        <div class="track-info">
          <span class="now-playing-tag">NU AAN HET AFSPELEN</span>
          <h2 class="current-title" id="currentTitle">Selecteer een set...</h2>
          <p class="current-artist" id="currentArtist">Lappendag Sound System</p>
        </div>

        <!-- Custom Scrubber Slider -->
        <div class="scrubber-container">
          <div class="time-display">
            <span id="currentTime">00:00:00</span>
            <span id="duration">00:00:00</span>
          </div>
          <div class="slider-wrapper">
            <input type="range" id="progressBar" min="0" max="100" value="0" step="0.1" aria-label="Audio scrubber slider">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>

        <!-- Player Controls -->
        <div class="player-controls">
          <button class="control-btn secondary" id="prevBtn" title="Vorig nummer">
            <i class="fa-solid fa-backward-step"></i>
          </button>
          
          <button class="control-btn primary play-btn" id="playBtn" title="Afspelen / Pauzeren">
            <i class="fa-solid fa-play" id="playIcon"></i>
          </button>

          <button class="control-btn secondary" id="nextBtn" title="Volgend nummer">
            <i class="fa-solid fa-forward-step"></i>
          </button>

          <button class="control-btn speed-btn" id="speedBtn" title="Afspeelsnelheid">
            <span id="speedLabel">1.0x</span>
          </button>
        </div>

        <!-- Volume & Extras -->
        <div class="volume-container">
          <button class="vol-btn" id="muteBtn" title="Dempen">
            <i class="fa-solid fa-volume-high" id="volIcon"></i>
          </button>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.9" aria-label="Volume slider">
        </div>
      </section>

      <!-- Playlist Section -->
      <section class="playlist-card glass-panel">
        <div class="playlist-header">
          <h3><i class="fa-solid fa-list-ul"></i> ALL AFTERPARTY SETS</h3>
          <span class="track-count" id="trackCount">7 Tracks</span>
        </div>

        <div class="playlist-scroll" id="playlist">
          <!-- Playlist items injected via JS -->
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>Lappendag Afterparty &copy; 2026 • Rave Edition • High Quality Audio</p>
    </footer>
  </div>

  <!-- Audio Element -->
  <audio id="audioPlayer" preload="metadata"></audio>

  <script src="app.js"></script>
</body>
</html>

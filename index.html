<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAPPENDAG AFTERPARTY // RAVE EDITION</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-photo" aria-hidden="true"></div>
  <div class="bg-dim" aria-hidden="true"></div>
  <!-- Ambient color wash over Haven.jpg -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>
  <div class="color-wash" aria-hidden="true"></div>
  <div class="grid-overlay"></div>

  <div class="corner-stack">
    <button type="button" class="location-btn" id="locationBtn" title="Locatie" aria-label="Toon locatie" aria-haspopup="dialog" aria-expanded="false">
      <i class="fa-solid fa-location-dot"></i>
    </button>
    <div class="time-badge" title="17:00" aria-label="17:00">17:00</div>
  </div>

  <div class="location-modal" id="locationModal" hidden>
    <div class="location-backdrop" id="locationBackdrop"></div>
    <div class="location-dialog" role="dialog" aria-modal="true" aria-labelledby="locationTitle">
      <div class="location-dialog-header">
        <h2 id="locationTitle">Locatie</h2>
        <button type="button" class="location-close" id="locationClose" aria-label="Sluiten">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <img class="location-map" src="locatie.png" alt="Kaart: Uit het water en uit je bol, Buitenhaven Hoorn">
    </div>
  </div>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <h1 class="title">LAPPENDAG <span class="neon-text">AFTERPARTY</span></h1>
      <p class="subtitle">Exclusieve DJ Sets & Unieke mixer • Non-Stop Energy</p>
    </header>

    <!-- Main Content Grid -->
    <main class="main-layout">
      <!-- Player Section -->
      <section class="player-card glass-panel">
        <div class="visualizer-wrapper">
          <div class="disc-container">
            <div class="disc" id="disc">
              <div class="disc-inner">
                <i class="fa-solid fa-compact-disc disc-icon"></i>
              </div>
            </div>
          </div>
          <!-- Equalizer animation -->
          <div class="eq-bars" id="eqBars">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
          </div>
        </div>

        <div class="track-info">
          <div class="now-playing-art" id="nowPlayingArt" aria-hidden="true"></div>
          <div class="track-info-text">
            <div class="current-title-row">
              <h2 class="current-title" id="currentTitle">Laden...</h2>
              <button type="button" class="list-toggle-btn now-playing-list-btn" id="nowPlayingListBtn" title="Naar My list" aria-label="Naar My list" hidden>
                <i class="fa-solid fa-plus" id="nowPlayingListIcon"></i>
              </button>
            </div>
            <p class="next-title" id="nextTitle" hidden></p>
          </div>
        </div>

        <!-- Custom Scrubber Slider -->
        <div class="scrubber-container">
          <div class="time-display">
            <span id="currentTime">00:00:00</span>
            <span id="duration">00:00:00</span>
          </div>
          <div class="slider-wrapper" id="sliderWrapper">
            <div class="progress-stack">
              <div class="progress-lane outgoing" id="outgoingLane">
                <div class="progress-fill" id="progressFill"></div>
              </div>
              <div class="progress-lane incoming" id="incomingLane" hidden>
                <div class="progress-fill incoming-fill" id="progressFillIncoming"></div>
              </div>
            </div>
            <input type="range" id="progressBar" min="0" max="100" value="0" step="0.1" aria-label="Audio scrubber slider">
          </div>
        </div>

        <!-- Player Controls -->
        <div class="player-controls">
          <button class="control-btn secondary" id="prevBtn" title="Vorig nummer">
            <i class="fa-solid fa-backward-step"></i>
          </button>
          
          <button class="control-btn primary play-btn" id="playBtn" title="Afspelen / Pauzeren">
            <i class="fa-solid fa-play" id="playIcon"></i>
          </button>

          <button class="control-btn secondary" id="nextBtn" title="Volgend nummer">
            <i class="fa-solid fa-forward-step"></i>
          </button>

          <button class="control-btn secondary active" id="randomBtn" title="Shuffle" aria-pressed="true">
            <i class="fa-solid fa-shuffle"></i>
          </button>

          <div class="mix-control">
            <button class="control-btn secondary active" id="mixBtn" title="Mix" aria-pressed="true" aria-label="Mix">
              <svg class="mix-icon" viewBox="0 0 36 26" aria-hidden="true" focusable="false">
                <!-- Soft offset edges -->
                <polygon points="0.6,7.7 19.2,7.7 14,24.8 0.6,24.8" fill="none" stroke="currentColor" stroke-opacity="0.28" stroke-width="0.7"/>
                <polygon points="19.2,1.2 34.8,1.2 34.8,16.8 14.4,16.8" fill="none" stroke="currentColor" stroke-opacity="0.22" stroke-width="0.7"/>
                <!-- Left block -->
                <polygon class="mix-icon-left" points="1.5,8.5 19,8.5 14,24 1.5,24" fill="currentColor"/>
                <!-- Right block (overlap) -->
                <polygon class="mix-icon-right" points="20,2 34.5,2 34.5,16.5 15.5,16.5" fill="currentColor" fill-opacity="0.4"/>
                <!-- Hash marks in overlap -->
                <g class="mix-icon-hash" stroke="currentColor" stroke-width="1.15" stroke-linecap="butt">
                  <line x1="16.4" y1="12.6" x2="14.7" y2="17.8"/>
                  <line x1="18.2" y1="12.2" x2="16.5" y2="17.4"/>
                  <line x1="20" y1="11.8" x2="18.3" y2="17"/>
                  <line x1="21.8" y1="11.4" x2="20.1" y2="16.6"/>
                </g>
              </svg>
            </button>
            <span class="mix-sec-label" id="mixDurationValue">…</span>
          </div>
        </div>

        <!-- Volume & Extras -->
        <div class="volume-container">
          <button class="vol-btn" id="muteBtn" title="Dempen">
            <i class="fa-solid fa-volume-high" id="volIcon"></i>
          </button>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.9" aria-label="Volume slider">
        </div>
      </section>

      <!-- Playlist Section -->
      <section class="playlist-card glass-panel">
        <div class="playlist-header">
          <div class="playlist-tabs" role="tablist">
            <button type="button" class="playlist-tab active" id="tabAll" role="tab" aria-selected="true">All</button>
            <button type="button" class="playlist-tab" id="tabMyList" role="tab" aria-selected="false">My list</button>
          </div>
          <span class="track-count" id="trackCount">0</span>
        </div>

        <div class="playlist-scroll" id="playlist">
          <!-- Playlist items injected via JS -->
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>Lappendag Afterparty &copy; 2026 • Rave Edition • High Quality Audio</p>
    </footer>
  </div>

  <!-- Dual audio decks for Mix crossfade -->
  <audio id="audioPlayer" preload="auto"></audio>
  <audio id="audioPlayerB" preload="auto"></audio>

  <script src="app.js"></script>
</body>
</html>

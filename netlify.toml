# GitHub-pushes mogen GEEN Netlify-build starten (spaart free credits).
# De live site laadt code/mp3's via CDN vanaf GitHub.
# Loader zelf: één keer handmatig alleen de map `netlify-deploy/` uploaden.
[build]
  ignore = "exit 0"
  command = "mkdir -p publish && cp netlify-index.html publish/index.html"
  publish = "publish"

[build.processing]
  skip_processing = true
